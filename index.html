<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{ --fg:#ffffff; --bg:#000000; }
  html,body{background:var(--bg);color:var(--fg);}
  body{ font-family:'Andale Mono','Space Mono',ui-monospace,'Menlo','Consolas',monospace; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  img{display:block;}

  /* ---------- TOP BAR ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:20px 26px;
    background:linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,0));
    pointer-events:none;
  }
  .navlabel{
    pointer-events:auto;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:#fff; cursor:pointer; background:none; border:none;
    font-family:inherit; text-shadow:0 1px 8px rgba(0,0,0,.4);
    opacity:.92; transition:opacity .2s ease;
  }
  .navlabel:hover{opacity:1;}
  .bag{justify-self:start;}
  .menu{justify-self:end;}
  .logo-top{
    justify-self:center; pointer-events:auto; cursor:pointer;
    height:30px; filter:drop-shadow(0 1px 8px rgba(0,0,0,.45));
    transition:transform .2s ease;
  }
  .logo-top:hover{transform:scale(1.06);}

  /* ---------- IMAGE STACK ---------- */
  #stack{ width:100%; }
  .frame{ position:relative; width:100%; line-height:0; }
  .frame img{ width:100%; height:auto; }
  .frame .remove{
    position:absolute; top:14px; right:16px; z-index:5;
    width:30px; height:30px; border-radius:50%;
    background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
    color:#fff; border:1px solid rgba(255,255,255,.35);
    font-size:16px; line-height:1; cursor:pointer;
    opacity:0; transition:opacity .2s ease;
  }
  .frame:hover .remove{opacity:1;}
  .frame:first-child .remove{ top:66px; }
  /* remove buttons only exist for admin */
  body:not(.admin) .frame .remove{ display:none; }

  /* ---------- EMPTY STATE ---------- */
  #empty{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; text-align:center;
    cursor:pointer; padding:40px;
  }
  #empty img{ height:96px; opacity:.95; }
  #empty p{ font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.55); }
  body.dragging #empty{ background:rgba(255,255,255,.04); }

  /* ---------- BOTTOM LOGO ---------- */
  .bottom{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:60px 20px 74px; background:#000; }
  .bottom img{ height:44px; cursor:pointer; opacity:.9; transition:opacity .2s ease, transform .2s ease; }
  .bottom img:hover{ opacity:1; transform:scale(1.05); }
  .bottom span{ font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.45); }

  /* drag hint */
  .drop-hint{ position:fixed; inset:0; z-index:60; pointer-events:none; border:2px dashed rgba(255,255,255,.6); margin:14px; border-radius:6px; display:none; align-items:center; justify-content:center; }
  body.dragging.admin .drop-hint, body.dragging.local .drop-hint{ display:flex; }
  .drop-hint span{ font-size:13px; letter-spacing:.24em; text-transform:uppercase; background:rgba(0,0,0,.6); padding:12px 22px; border-radius:40px; }

  /* ---------- FULL-SCREEN OVERLAYS ---------- */
  .overlay-full{ position:fixed; inset:0; z-index:80; background:#000; display:none; flex-direction:column; opacity:0; transition:opacity .3s ease; }
  .overlay-full.open{ display:flex; opacity:1; }
  .overlay-bar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:20px 26px; }
  .overlay-bar .logo-top{ filter:none; }

  #menuList{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:20px; }
  #menuList a{ color:#fff; text-decoration:none; text-transform:uppercase; font-size:clamp(22px,5vw,34px); letter-spacing:.16em; font-weight:500; opacity:.82; transition:opacity .2s ease; cursor:pointer; }
  #menuList a:hover{ opacity:1; }
  #menuList a.auth{ font-size:clamp(13px,2.6vw,15px); letter-spacing:.28em; opacity:.5; margin-top:14px; }
  #menuList a.auth:hover{ opacity:.9; }

  #viewBody{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .tour-title{ font-size:clamp(34px,9vw,86px); letter-spacing:.06em; text-transform:uppercase; line-height:1.02; font-weight:700; }
  .tour-sub{ margin-top:26px; font-size:clamp(12px,2.4vw,16px); letter-spacing:.28em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  .soon{ font-size:clamp(26px,7vw,60px); letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  .soon small{ display:block; margin-top:20px; font-size:12px; letter-spacing:.28em; color:rgba(255,255,255,.5); }

  /* login */
  #loginBody{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; }
  #loginBody img{ height:70px; margin-bottom:14px; }
  #loginForm{ display:flex; flex-direction:column; gap:14px; width:min(340px,86vw); }
  #loginForm input{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff;
    font-family:inherit; font-size:14px; letter-spacing:.1em; padding:14px 16px; border-radius:2px;
  }
  #loginForm input:focus{ outline:none; border-color:#fff; }
  #loginForm button{
    background:#fff; color:#000; border:none; font-family:inherit; cursor:pointer;
    font-size:13px; letter-spacing:.24em; text-transform:uppercase; padding:15px; border-radius:2px;
    transition:opacity .2s ease;
  }
  #loginForm button:hover{ opacity:.85; }
  #loginErr{ min-height:16px; font-size:11px; letter-spacing:.12em; color:#ff8a7a; text-transform:uppercase; text-align:center; }

  /* toast */
  #toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,.95); color:#000; font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:11px 20px; border-radius:40px; z-index:200; opacity:0; transition:opacity .3s ease; pointer-events:none; max-width:88vw; text-align:center; }
  #toast.show{ opacity:1; }

  @media(max-width:600px){
    header,.overlay-bar{padding:16px 18px;}
    .logo-top{height:26px;}
    .navlabel{font-size:12px;}
  }
</style>
</head>

<input type="file" id="picker" accept="image/*" multiple style="display:none;" />

<script>
(function(){
  /* ============================================================
     CONFIG — paste your Supabase project values here.
     Leave blank to run in local demo mode (in-memory, no login).
     The anon key is safe to expose; security is enforced by
     Row Level Security policies in Supabase.
  ============================================================ */
  const SUPABASE_URL      = 'https://hmogjqpbwtxpuimivejy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_x-xoQPUM2zbbl_xun4pBtg_KF8juRa2';
  const BUCKET            = 'ra-images';

  const WAVESYNC_URL = 'https://wavesyncc.com';
  const MUSIC_URL    = 'https://music.apple.com/profile/rennanands';
  const TOUR_HTML = `<div class="tour-title">Renn&aacute;n<br>On Tour<br>2027</div><div class="tour-sub">(Pre-sale is sold out)</div>`;
  const comingSoon = (n)=>`<div class="soon">${n}<small>Coming soon</small></div>`;

  const LIVE = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;
  let sb = null, isAdmin = false;
  const localImages = [];

  /* ===== ELEMENTS ===== */
  const stack=document.getElementById('stack');
  const empty=document.getElementById('empty');
  const emptyText=document.getElementById('emptyText');
  const bottom=document.getElementById('bottomBar');
  const bottomText=document.getElementById('bottomText');
  const picker=document.getElementById('picker');
  const menuOverlay=document.getElementById('menuOverlay');
  const viewOverlay=document.getElementById('viewOverlay');
  const viewBody=document.getElementById('viewBody');
  const menuList=document.getElementById('menuList');
  const loginOverlay=document.getElementById('loginOverlay');
  const toastEl=document.getElementById('toast');

  document.body.classList.toggle('local', !LIVE);

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),3200); }
  const canUpload = ()=> !LIVE || isAdmin;

  /* ===== EMPTY / BOTTOM STATE ===== */
  function refreshUI(){
    const has = stack.children.length>0;
    empty.style.display = has ? 'none' : 'flex';
    bottom.style.display = has ? 'flex' : 'none';
    // text visibility depends on upload rights
    emptyText.style.display = canUpload() ? 'block' : 'none';
    bottomText.style.display = canUpload() ? 'block' : 'none';
  }

  /* ===== RENDER A FRAME ===== */
  function renderFrame(item){
    const frame=document.createElement('div'); frame.className='frame';
    const img=document.createElement('img'); img.src=item.url; img.loading='lazy';
    const rm=document.createElement('button'); rm.className='remove'; rm.innerHTML='&times;'; rm.title='Remove';
    rm.addEventListener('click', async ()=>{
      if(!canUpload()) return;
      if(LIVE){
        rm.disabled=true;
        const { error:sErr } = await sb.storage.from(BUCKET).remove([item.path]);
        const { error:dErr } = await sb.from('images').delete().eq('id', item.id);
        if(sErr||dErr){ toast((sErr||dErr).message); rm.disabled=false; return; }
      } else {
        const i=localImages.indexOf(item); if(i>-1) localImages.splice(i,1);
      }
      frame.remove(); refreshUI();
    });
    frame.appendChild(img); frame.appendChild(rm); stack.appendChild(frame);
  }

  /* ===== UPLOAD ===== */
  function readAsDataURL(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file); }); }
  async function addFiles(list){
    if(!canUpload()){ if(LIVE) openLogin(); return; }
    const files=Array.from(list).filter(f=>f.type.startsWith('image/'));
    for(const file of files){
      if(LIVE){
        const safe=file.name.replace(/[^\w.\-]/g,'_');
        const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
        toast('Uploading…');
        const { error:upErr }=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});
        if(upErr){ toast(upErr.message); continue; }
        const { data:pub }=sb.storage.from(BUCKET).getPublicUrl(path);
        const { data:row, error:insErr }=await sb.from('images').insert({ path, url:pub.publicUrl }).select().single();
        if(insErr){ toast(insErr.message); continue; }
        renderFrame({ id:row.id, url:row.url, path:row.path });
        toast('Added');
      } else {
        const url=await readAsDataURL(file); const item={url}; localImages.push(item); renderFrame(item);
      }
      refreshUI();
    }
  }
  const openPicker=()=>picker.click();
  picker.addEventListener('change',e=>{ addFiles(e.target.files); picker.value=''; });

  // logo taps: admin/local -> upload ; public live -> login
  function primaryTap(){ if(canUpload()) openPicker(); else openLogin(); }
  empty.addEventListener('click', primaryTap);
  document.getElementById('logoTop').addEventListener('click', primaryTap);
  document.getElementById('logoBottom').addEventListener('click', primaryTap);

  // drag & drop (upload rights only)
  ['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{ e.preventDefault(); if(canUpload()) document.body.classList.add('dragging'); }));
  ['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'||e.relatedTarget===null) document.body.classList.remove('dragging'); }));
  window.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  /* ===== MENU + VIEWS ===== */
  const openMenu=()=>menuOverlay.classList.add('open');
  const closeMenu=()=>menuOverlay.classList.remove('open');
  const openView=(h)=>{ viewBody.innerHTML=h; viewOverlay.classList.add('open'); closeMenu(); };
  const closeView=()=>viewOverlay.classList.remove('open');
  const openLogin=()=>{ document.getElementById('loginErr').textContent=''; loginOverlay.classList.add('open'); closeMenu(); };
  const closeLogin=()=>loginOverlay.classList.remove('open');
  function goHome(){ closeMenu(); closeView(); closeLogin(); window.scrollTo({top:0,behavior:'smooth'}); }

  const MENU=[
    { label:'Home',     action:goHome },
    { label:'Act II',   action:()=>openView(comingSoon('Act II')) },
    { label:'Wavesync', href:WAVESYNC_URL },
    { label:'Music',    href:MUSIC_URL },
    { label:'Tour',     action:()=>openView(TOUR_HTML) },
    { label:'Shop',     action:()=>openView(comingSoon('Shop')) },
    { label:'About',    action:()=>openView(comingSoon('About')) },
  ];
  MENU.forEach(item=>{
    const a=document.createElement('a'); a.textContent=item.label;
    if(item.href){ a.href=item.href; a.target='_blank'; a.rel='noopener'; a.addEventListener('click',()=>closeMenu()); }
    else { a.href='#'; a.addEventListener('click',e=>{ e.preventDefault(); item.action(); }); }
    menuList.appendChild(a);
  });
  // auth link (live mode only)
  let authLink=null;
  if(LIVE){
    authLink=document.createElement('a'); authLink.className='auth'; authLink.href='#';
    authLink.addEventListener('click', async e=>{
      e.preventDefault();
      if(isAdmin){ await sb.auth.signOut(); toast('Logged out'); closeMenu(); }
      else openLogin();
    });
    menuList.appendChild(authLink);
  }
  function updateAuthLink(){ if(authLink) authLink.textContent = isAdmin ? 'Log Out' : 'Login'; }

  document.getElementById('menu').addEventListener('click',openMenu);
  document.querySelectorAll('[data-close-menu]').forEach(b=>b.addEventListener('click',closeMenu));
  document.querySelectorAll('[data-close-view]').forEach(b=>b.addEventListener('click',closeView));
  document.querySelectorAll('[data-close-login]').forEach(b=>b.addEventListener('click',closeLogin));
  document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',goHome));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMenu(); closeView(); closeLogin(); } });
  document.getElementById('bag').addEventListener('click',()=>{});

  /* ===== LOGIN FORM ===== */
  document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    if(!LIVE){ document.getElementById('loginErr').textContent='Add Supabase keys to enable login'; return; }
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    const { error }=await sb.auth.signInWithPassword({ email, password });
    if(error){ document.getElementById('loginErr').textContent=error.message; }
    else { document.getElementById('loginErr').textContent=''; document.getElementById('loginForm').reset(); closeLogin(); toast('Welcome back'); }
  });

  /* ===== AUTH STATE ===== */
  function setAdmin(v){ isAdmin=v; document.body.classList.toggle('admin', v); updateAuthLink(); refreshUI(); }

  /* ===== BOOT ===== */
  async function loadImages(){
    const { data, error }=await sb.from('images').select('*').order('created_at',{ascending:true});
    if(error){ toast(error.message); return; }
    stack.innerHTML='';
    data.forEach(r=>renderFrame({ id:r.id, url:r.url, path:r.path }));
    refreshUI();
  }
  async function boot(){
    if(LIVE){
      sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data:{ session } }=await sb.auth.getSession();
      setAdmin(!!session);
      sb.auth.onAuthStateChange((_e,s)=>setAdmin(!!s));
      await loadImages();
    } else {
      updateAuthLink(); refreshUI();
    }
  }
  boot();
})();
</script>
</body>
</html>
